<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TidyBoard</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><div><p class="eyebrow">Personal workspace</p><h1>TidyBoard</h1></div><button id="sign-out" class="secondary" hidden>Sign out</button></header>
<section id="signin" class="card"><h2>Keep your work moving</h2><p>Sign in to open your private boards. This button uses a development-only mock session.</p><button id="sign-in">Continue with Google (mock)</button></section>
<section id="workspace" hidden><p id="message" role="status" aria-live="polite"></p><div class="toolbar"><form id="search-form"><label for="search-input">Search tasks</label><input id="search-input" placeholder="Title or description"><button>Search</button></form><button id="new-board">New board</button></div><div class="layout"><aside class="card"><div class="tabs"><button id="active-tab" aria-pressed="true">Active</button><button id="archive-tab" aria-pressed="false">Archived</button></div><ul id="boards"></ul></aside><section id="board" class="card" hidden><div class="board-head"><h2 id="board-title"></h2><button id="new-task">Add task</button></div><form id="create-task-form" class="create-task"><label for="new-task-title">Task title</label><input id="new-task-title" maxlength="120" required><label for="new-task-description">Description (optional)</label><textarea id="new-task-description" maxlength="5000"></textarea><button id="create-task" type="button">Create in To Do</button></form><div id="columns" class="columns"></div></section></div><section class="card"><h2>Search results</h2><ul id="results"><li class="empty">Enter text to search titles and descriptions.</li></ul></section></section>
<dialog id="panel"><form method="dialog"><button id="close-panel" class="close" aria-label="Close">×</button><h2>Edit task</h2><label for="task-title">Title</label><input id="task-title" maxlength="120"><label for="task-description">Description</label><textarea id="task-description" maxlength="5000"></textarea><label for="task-status">Status</label><select id="task-status"><option value="todo">To Do</option><option value="doing">In Progress</option><option value="done">Done</option></select><div class="actions"><button id="save-task" type="button">Save</button><button id="cancel-task" type="button" class="secondary">Cancel</button><button id="delete-task" type="button" class="danger">Delete permanently</button></div></form></dialog><script type="module" src="app.js"></script></main></body></html>
